services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-coursepilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    ports:
      - "8080:8080"
    environment:
      MODE: ${MODE:-}
      HOST: 0.0.0.0
      PORT: 8080
      GRACEFUL_SHUTDOWN_TIMEOUT: ${GRACEFUL_SHUTDOWN_TIMEOUT:-30}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      AUTH_SECRET: ${AUTH_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      USE_FAKE_MODEL: ${USE_FAKE_MODEL:-true}
      COMPATIBLE_MODEL: ${COMPATIBLE_MODEL:-}
      COMPATIBLE_API_KEY: ${COMPATIBLE_API_KEY:-}
      COMPATIBLE_BASE_URL: ${COMPATIBLE_BASE_URL:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-fake}
      DATABASE_TYPE: ${DATABASE_TYPE:-postgres}
      SQLITE_DB_PATH: ${SQLITE_DB_PATH:-checkpoints.db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-coursepilot}
      POSTGRES_APPLICATION_NAME: ${POSTGRES_APPLICATION_NAME:-coursepilot}
      POSTGRES_MIN_CONNECTIONS_PER_POOL: ${POSTGRES_MIN_CONNECTIONS_PER_POOL:-1}
      POSTGRES_MAX_CONNECTIONS_PER_POOL: ${POSTGRES_MAX_CONNECTIONS_PER_POOL:-1}
      COURSEPILOT_DATABASE_URL: ${COURSEPILOT_DATABASE_URL:-}
      COURSEPILOT_STORAGE_DIR: ./storage
      COURSEPILOT_CHROMA_DIR: ./chroma_db
      COURSEPILOT_MAX_REPAIR_ROUNDS: ${COURSEPILOT_MAX_REPAIR_ROUNDS:-2}
      COURSEPILOT_DUPLICATE_THRESHOLD: ${COURSEPILOT_DUPLICATE_THRESHOLD:-0.85}
      COURSEPILOT_ENABLED: ${COURSEPILOT_ENABLED:-true}
      COURSEPILOT_GENERATION_MODE: ${COURSEPILOT_GENERATION_MODE:-auto}
      COURSEPILOT_DISABLE_DETERMINISTIC_FALLBACK: ${COURSEPILOT_DISABLE_DETERMINISTIC_FALLBACK:-false}
      COURSEPILOT_LLM_TIMEOUT_SECONDS: ${COURSEPILOT_LLM_TIMEOUT_SECONDS:-120}
      COURSEPILOT_IDEMPOTENCY_LEASE_SECONDS: ${COURSEPILOT_IDEMPOTENCY_LEASE_SECONDS:-14400}
      COURSEPILOT_ASYNC_WORKER_ENABLED: ${COURSEPILOT_ASYNC_WORKER_ENABLED:-true}
      COURSEPILOT_ASYNC_WORKER_POLL_SECONDS: ${COURSEPILOT_ASYNC_WORKER_POLL_SECONDS:-1}
      COURSEPILOT_ASYNC_TASK_LEASE_SECONDS: ${COURSEPILOT_ASYNC_TASK_LEASE_SECONDS:-300}
      COURSEPILOT_ASYNC_WORKER_SHUTDOWN_TIMEOUT_SECONDS: ${COURSEPILOT_ASYNC_WORKER_SHUTDOWN_TIMEOUT_SECONDS:-10}
      COURSERAG_ARTIFACT_DIR: ${COURSERAG_ARTIFACT_DIR:-./storage/courserag/artifacts}
      COURSERAG_ARTIFACT_RETENTION_HOURS: ${COURSERAG_ARTIFACT_RETENTION_HOURS:-168}
      COURSERAG_STAGING_RETENTION_HOURS: ${COURSERAG_STAGING_RETENTION_HOURS:-72}
      COURSERAG_RENDERER_PROFILE_PATH: ${COURSERAG_RENDERER_PROFILE_PATH:-resources/renderers/libreoffice_headless_v1/profile.json}
      COURSERAG_LIBREOFFICE_PATH: ${COURSERAG_LIBREOFFICE_PATH:-soffice}
      COURSERAG_RENDER_TIMEOUT_SECONDS: ${COURSERAG_RENDER_TIMEOUT_SECONDS:-300}
      COURSERAG_MAX_DOCUMENT_BYTES: ${COURSERAG_MAX_DOCUMENT_BYTES:-104857600}
      COURSERAG_MAX_PDF_PAGES: ${COURSERAG_MAX_PDF_PAGES:-2000}
      COURSERAG_OCR_PROVIDER: ${COURSERAG_OCR_PROVIDER:-rapidocr}
      COURSERAG_OCR_PROFILE_PATH: ${COURSERAG_OCR_PROFILE_PATH:-/opt/courserag-ocr/runtime-profile.json}
      COURSERAG_OCR_DPI: ${COURSERAG_OCR_DPI:-200}
      COURSERAG_OCR_MIN_NATIVE_CHARS: ${COURSERAG_OCR_MIN_NATIVE_CHARS:-30}
      COURSERAG_OCR_MIN_PRINTABLE_RATIO: ${COURSERAG_OCR_MIN_PRINTABLE_RATIO:-0.80}
      COURSERAG_OCR_MAX_GARBLED_RATIO: ${COURSERAG_OCR_MAX_GARBLED_RATIO:-0.20}
      COURSERAG_OCR_HYBRID_MIN_IMAGE_AREA_RATIO: ${COURSERAG_OCR_HYBRID_MIN_IMAGE_AREA_RATIO:-0.50}
      COURSERAG_OCR_HYBRID_MAX_NATIVE_TEXT_AREA_RATIO: ${COURSERAG_OCR_HYBRID_MAX_NATIVE_TEXT_AREA_RATIO:-0.35}
      COURSERAG_OCR_MAX_PIXELS: ${COURSERAG_OCR_MAX_PIXELS:-20000000}
      COURSERAG_OCR_TIMEOUT_SECONDS: ${COURSERAG_OCR_TIMEOUT_SECONDS:-90}
      COURSERAG_OCR_MAX_MEMORY_BYTES: ${COURSERAG_OCR_MAX_MEMORY_BYTES:-1610612736}
      COURSERAG_OCR_MAX_WORKERS: ${COURSERAG_OCR_MAX_WORKERS:-1}
      COURSERAG_OCR_MIN_CONFIDENCE: ${COURSERAG_OCR_MIN_CONFIDENCE:-0.75}
      COURSEPILOT_LLM_MAX_RETRIES: ${COURSEPILOT_LLM_MAX_RETRIES:-2}
      COURSEPILOT_LLM_HEALTH_CHECK_MODE: ${COURSEPILOT_LLM_HEALTH_CHECK_MODE:-http}
      COURSEPILOT_LLM_HEALTH_CHECK_TIMEOUT_SECONDS: ${COURSEPILOT_LLM_HEALTH_CHECK_TIMEOUT_SECONDS:-5}
      COURSEPILOT_TOKENIZER_PATH: deepseek_v3_tokenizer/deepseek_v3_tokenizer/tokenizer.json
      COURSEPILOT_EMBEDDING_PROVIDER: ${COURSEPILOT_EMBEDDING_PROVIDER:-auto}
      COURSEPILOT_EMBEDDING_MODEL: ${COURSEPILOT_EMBEDDING_MODEL:-}
      COURSEPILOT_EMBEDDING_BASE_URL: ${COURSEPILOT_EMBEDDING_BASE_URL:-}
      COURSEPILOT_EMBEDDING_API_KEY: ${COURSEPILOT_EMBEDDING_API_KEY:-}
      COURSEPILOT_EMBEDDING_MAX_RETRIES: ${COURSEPILOT_EMBEDDING_MAX_RETRIES:-4}
      COURSEPILOT_EMBEDDING_RETRY_BASE_SECONDS: ${COURSEPILOT_EMBEDDING_RETRY_BASE_SECONDS:-15}
      COURSEPILOT_EMBEDDING_RETRY_MAX_SECONDS: ${COURSEPILOT_EMBEDDING_RETRY_MAX_SECONDS:-120}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./storage:/app/storage
      - ./chroma_db:/app/chroma_db
    develop:
      watch:
        - path: src/agents/
          action: sync+restart
          target: /app/agents/
        - path: src/coursepilot/
          action: sync+restart
          target: /app/coursepilot/
        - path: src/courserag/
          action: sync+restart
          target: /app/courserag/
        - path: src/schema/
          action: sync+restart
          target: /app/schema/
        - path: src/service/
          action: sync+restart
          target: /app/service/
        - path: src/core/
          action: sync+restart
          target: /app/core/
        - path: src/memory/
          action: sync+restart
          target: /app/memory/

  streamlit_app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    ports:
      - "8501:8501"
    depends_on:
      - agent_service
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8501/healthz', timeout=5).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      AGENT_URL: http://agent_service:8080
    develop:
      watch:
        - path: src/client/
          action: sync+restart
          target: /app/client/
        - path: src/coursepilot/
          action: sync+restart
          target: /app/coursepilot/
        - path: src/schema/
          action: sync+restart
          target: /app/schema/
        - path: src/streamlit_app.py
          action: sync+restart
          target: /app/streamlit_app.py

volumes:
  postgres_data:
