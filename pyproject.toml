[project]
name = "coursepilot"
version = "0.1.0"
description = "CoursePilot teacher assistant agent system"
readme = "README.md"
authors = [{ name = "Joshua Carroll", email = "carroll.joshk@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

requires-python = ">=3.11,<3.14"

dependencies = [
    "alembic ~=1.14.0",
    "docx2txt ~=0.8",
    "fastapi ~=0.115.5",
    "httpx ~=0.28.0",
    "langchain-core ~=1.0.0",
    "langchain-chroma ~=1.0.0",
    "langchain-openai ~=1.0.2",
    "langgraph ~=1.0.0",
    "langgraph-checkpoint-postgres ~=2.0.13",
    "langgraph-checkpoint-sqlite ~=2.0.1",
    "openpyxl ~=3.1.5",
    "psycopg[binary,pool] ~=3.2.4",
    "pydantic ~=2.10.1",
    "pydantic-settings ~=2.12.0",
    "pymupdf ~=1.25.0",
    "python-docx ~=1.1.2",
    "python-dotenv ~=1.0.1",
    "python-multipart ~=0.0.20",
    "python-pptx ~=1.0.2",
    "sqlalchemy ~=2.0.36",
    "streamlit ~=1.52.0",
    "tokenizers ~=0.22.1",
    "uvicorn ~=0.32.1",
    "bm25s>=0.3.10",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
local-embedding-cu126 = [
    "psutil==7.2.2",
    "sentence-transformers>=5.1,<6",
    "torch>=2.10,<2.13",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-env",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

# Group for the minimal dependencies to run just the client and Streamlit app.
# These are also installed in the default dependencies.
# To install run: `uv sync --frozen --only-group client`
client = [
    "httpx~=0.28.0",
    "pydantic ~=2.10.1",
    "python-dotenv ~=1.0.1",
    "streamlit~=1.52.0",
]

ocr-common = [
    "pydantic ~=2.10.1",
    "psutil ==7.2.2",
]

ocr-rapidocr = [
    "onnxruntime ==1.21.1",
    "rapidocr ==3.9.1",
]

ocr-paddleocr = [
    "paddleocr ==3.7.0",
    "paddlepaddle ==3.3.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "local-embedding-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "U"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "b0_sample_files: gated P00 smoke using local, owner-supplied DOCX/PDF inputs",
]

[tool.pytest_env]
OPENAI_API_KEY = "sk-fake-openai-key"

[tool.mypy]
plugins = "pydantic.mypy"
exclude = "src/streamlit_app.py"

[[tool.mypy.overrides]]
module = ["bm25s.*", "docx2txt.*", "fitz.*", "jieba.*", "openpyxl.*", "psutil.*", "tokenizers.*"]
ignore_missing_imports = true
