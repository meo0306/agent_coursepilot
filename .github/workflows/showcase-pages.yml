name: Deploy portfolio showcase to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-showcase-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio_showcase/package-lock.json
      - name: Install dependencies
        working-directory: portfolio_showcase
        run: npm ci
      - name: Validate and build
        working-directory: portfolio_showcase
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio_showcase/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
