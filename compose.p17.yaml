services:
  postgres:
    environment:
      POSTGRES_DB: ${P17_POSTGRES_DB:-agent_service}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${P17_POSTGRES_DB:-agent_service}",
        ]

  agent_service:
    image: agent_coursepilot-agent_service:latest
    ports:
      - "8080:8080"
    environment:
      COURSEPILOT_SERVICE_ROLE: coursepilot
      COURSEPILOT_COURSERAG_MODE: remote
      COURSEPILOT_COURSERAG_BASE_URL: http://courserag_service:8081
      COURSEPILOT_COURSERAG_AUTH_TOKEN: ${AUTH_SECRET:-p17-local-service-token}
      COURSEPILOT_ASYNC_WORKER_ENABLED: "false"
      POSTGRES_DB: ${P17_POSTGRES_DB:-agent_service}
    depends_on:
      postgres:
        condition: service_healthy
      courserag_service:
        condition: service_healthy
    volumes:
      - ./src/agents:/app/agents
      - ./src/core:/app/core
      - ./src/memory:/app/memory
      - ./src/schema:/app/schema
      - ./src/service:/app/service
      - ./src/coursepilot:/app/coursepilot
      - ./src/courserag:/app/courserag
      - ./storage:/app/storage
      - ./chroma_db:/app/chroma_db

  courserag_service:
    image: agent_coursepilot-agent_service:latest
    command: ["python", "run_service.py"]
    ports:
      - "8081:8081"
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      AUTH_SECRET: ${AUTH_SECRET:-p17-local-service-token}
      COURSEPILOT_SERVICE_ROLE: courserag
      COURSEPILOT_COURSERAG_MODE: local
      COURSEPILOT_ASYNC_WORKER_ENABLED: "false"
      DATABASE_TYPE: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${P17_POSTGRES_DB:-agent_service}
      POSTGRES_APPLICATION_NAME: courserag-p17
      COURSEPILOT_DATABASE_URL: ${COURSEPILOT_DATABASE_URL:-}
      COURSERAG_ARTIFACT_DIR: /app/storage/courserag/artifacts
      COURSERAG_RETRIEVAL_BACKEND: ${COURSERAG_RETRIEVAL_BACKEND:-legacy}
      USE_FAKE_MODEL: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=5).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./src/agents:/app/agents
      - ./src/core:/app/core
      - ./src/memory:/app/memory
      - ./src/schema:/app/schema
      - ./src/service:/app/service
      - ./src/coursepilot:/app/coursepilot
      - ./src/courserag:/app/courserag
      - ./storage:/app/storage
      - ./chroma_db:/app/chroma_db
